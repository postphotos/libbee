[project]
name = "libbee"
version = "0.0.1"
description = "US (American) public-library funding, usage, and operations + community civics data (1992–2023) — integrated from IMLS, Census, and HUD into one tidy `facts` table."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Leo Postovoit", email = "leo@leopostovoit.com" },
]
maintainers = [
    { name = "Leo Postovoit", email = "leo@leopostovoit.com" },
]
keywords = [
    "public-libraries", "IMLS", "open-data", "data-product", "civic-data",
    "polars", "census", "HUD", "homelessness", "budget-allocation",
    "policy-analysis", "resource-allocation", "civic-tech",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Office/Business",
    "Topic :: Sociology",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
# Core = read + build the data product (load/scan/facts + the fetch→conform→store pipeline).
# Everything heavier (the ML "cuts", the Altair theme, DuckDB, the marimo tooling) is opt-in below.
dependencies = [
    "polars>=1.41.2",
    "pyarrow>=24.0.0",
    "numpy>=2.0",
    "pandas>=2.2.0",          # adapters: ca_libpas read_html
    "lxml>=5.0.0",            # read_html backend
    "fastexcel>=0.10.0",      # adapters: HUD xlsx
    "requests>=2.32",         # adapters: fetch
    "adbc-driver-sqlite>=1.1.0",  # io.store: write_database(engine="adbc")
    "pydantic>=2.0",          # io.schemas: metadata-level validation (schema contracts, MANIFEST)
    "pydantic-settings>=2.0",  # io.config: validated env / credentials (CENSUS_API_KEY)
]

# Optional extras — the data core stays lean; opt into the heavier analytical/DB layers as needed.
[project.optional-dependencies]
analysis = ["scikit-learn>=1.5", "statsmodels>=0.14.0", "scipy>=1.13.0", "shap>=0.46.0"]
duckdb = ["duckdb>=1.1"]
notebook = ["marimo>=0.23.8", "anywidget>=0.11.0", "nbformat>=5.10.4", "docstring-to-markdown>=0.13"]
dev = [
    "pytest>=8.3.0", "pytest-cov>=6.0.0", "ruff>=0.9.0",
    "scikit-learn>=1.5", "statsmodels>=0.14.0", "scipy>=1.13.0", "shap>=0.46.0",
    "duckdb>=1.1", "marimo>=0.23.8", "anywidget>=0.11.0", "nbformat>=5.10.4",
    "altair>=5.0.0",  # for the example notebook (examples/libbee_notebook.py)
]
all = [
    "scikit-learn>=1.5", "statsmodels>=0.14.0", "scipy>=1.13.0", "shap>=0.46.0",
    "duckdb>=1.1", "marimo>=0.23.8", "anywidget>=0.11.0", "nbformat>=5.10.4",
]

[project.urls]
Homepage = "https://github.com/postphotos/libbee"
Documentation = "https://github.com/postphotos/libbee#readme"
Repository = "https://github.com/postphotos/libbee"
"Source Code" = "https://github.com/postphotos/libbee/tree/main/libbee"
"Bug Tracker" = "https://github.com/postphotos/libbee/issues"
Changelog = "https://github.com/postphotos/libbee/releases"
"Discussions" = "https://github.com/postphotos/libbee/discussions"

[project.scripts]
libbee = "libbee.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libbee"]
# Ship the library, not its test suite.
exclude = ["libbee/tests"]

[dependency-groups]
# `uv sync` installs this group by default; it includes the extras so the full test suite runs.
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    # extras, so `uv run pytest` exercises analysis/duckdb/notebook code paths
    "scikit-learn>=1.5",
    "statsmodels>=0.14.0",
    "scipy>=1.13.0",
    "shap>=0.46.0",
    "duckdb>=1.1",
    "marimo>=0.23.8",
    "anywidget>=0.11.0",
    "nbformat>=5.10.4",
    # editor / agent tooling — never runtime deps of the library
    "basedpyright>=1.39.6",
    "pyright>=1.1.409",
    "pyrefly>=1.0.0",
    "ty>=0.0.42",
    "python-lsp-server>=1.14.0",
    "mcp>=1.27.2",
    "pydantic-ai>=1.104.0",
    "websockets>=16.0",
    "altair>=6.1.0",
]

[tool.pytest.ini_options]
testpaths = ["libbee/tests"]
# Coverage: measure the package once (`--cov=libbee`) and scope it via `omit` below. NB: a granular
# `--cov=libbee.analysis --cov=libbee.geo …` list makes pytest-cov import each named module separately,
# which double-imports libbee and trips numpy's "cannot load module more than once" C-extension guard —
# so we measure the package as a whole and exclude the not-gated modules in [tool.coverage.run].omit.
addopts = "--cov=libbee --cov-branch --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["libbee"]
# Pure modules (analysis, geo, paths, metrics, adapters.base, fetch, …) are unit-tested to 100%.
# IO-heavy / entrypoint code (adapters, sources, store, __main__) is exercised by the integration build +
# `libbee verify`, not the unit gate; tests measure themselves out.
omit = [
    "libbee/sources/*",
    "libbee/adapters/*.py",
    "libbee/io/store.py",
    "libbee/__main__.py",
    "libbee/examples/*",
    "libbee/tests/*",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:", "raise NotImplementedError"]

[tool.ruff]
line-length = 180
# The vendored sources/ are legacy fetch scripts.
extend-exclude = ["libbee/sources"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B018"]

[tool.pyright]
reportUnusedExpression = "none"
